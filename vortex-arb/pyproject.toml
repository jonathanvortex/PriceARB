[project]
name = "vortex"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["websockets", "httpx", "pyarrow", "duckdb", "pyyaml", "pydantic"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "pre-commit", "jupyter", "pandas", "matplotlib"]

[tool.ruff]
line-length = 100
